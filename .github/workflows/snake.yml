name: generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"  # يحدث مرتين في اليوم
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@master
        with:
          github_user_name: Ahmedkhaled1122
          outputs: dist/output/snake.svg

      - name: Push changes
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
